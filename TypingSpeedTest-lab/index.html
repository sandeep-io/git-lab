<!DOCTYPE html>
<html>
<head>
    <title>Typing Speed Test</title>
</head>
<body>

    <h1>Typing Speed Test</h1>

    <p id="phrase">
        JavaScript is a powerful programming language.
    </p>

    <textarea
        id="inputText"
        rows="5"
        cols="50"
        placeholder="Start typing here..."

    <button onclick="startTest()">Start Test</button>

    <h3 id="result"></h3>

    <script src="script.js"></script>

</body>
</html>
